# @package _global_

defaults:
  - /habitat: habitat_config_base
  - /habitat/task: objectnav
  - /habitat/simulator/sensor_setups@habitat.simulator.agents.main_agent: rgbd_agent
  - /habitat/dataset/objectnav: hm3d
  - _self_

habitat:
  environment:
    max_episode_steps: 500
    iterator_options:
      shuffle: false
  simulator:
    forward_step_size: 0.25
    turn_angle: 30
    agents:
      main_agent:
        height: 0.88
        radius: 0.18
        sim_sensors:
          rgb_sensor:
            width: 640
            height: 480
            hfov: 79
            position: [0, 0.88, 0]
          depth_sensor:
            width: 640
            height: 480
            hfov: 79
            min_depth: 0.0
            max_depth: 5.0
            position: [0, 0.88, 0]
    habitat_sim_v0:
      gpu_device_id: 0
      allow_sliding: true
  task:
    measurements:
      success:
        success_distance: 1.0
