# @package _global_
# Flat variant of the visual-token pruning experiment (paper/token_prune/README.md, "Flat
# variant"): the selection rule alone, independent of time and of layer.
#
# No recency window -- LongNav-R1 keeps the full episode context and the frame-relative budget
# is k x the running mean visual count over every history frame -- and every method scores and
# deletes at decoder layer 0 (all layers lose the token, so the arms are memory-matched). One
# arm = this preset + the method overrides (see paper/token_prune/run_r1.sh, VARIANT=flat):
#   random    vlm.kv_prune_importance=random
#   divprune  vlm.kv_prune_importance=divprune
#   fastv     vlm.kv_prune_importance=attn vlm.kv_prune_score_layer=0   (layer-0 decision row)
#   dart      vlm.kv_prune_importance=dart                              (layer-0 keys + layer-0 output)
# plus vlm.kv_prune_budget_frames=<k> (k in {32,16,8,4} frames' worth of history tokens);
# r1_identity adds nothing (unlimited budget) and must reproduce the ctx ablation's r1_full.
#
# Launch from the repo root:
#   python -m longnav.scripts.eval +checkpoint=longnav +dataset=hm3d_v2_val \
#     +experiment=paper_prune_flat +resources=single task.run_name=r1_fastv_b8 \
#     vlm.kv_prune_importance=attn vlm.kv_prune_score_layer=0 vlm.kv_prune_budget_frames=8
task:
  run_name: "name me"
  wandb_project: "longnav_paper_flat"  # own project: wandb resume keys on (project, run name) and the
                                      # arm names repeat Exp 4's, which would otherwise read as already done
  output_dir: ./paper_results/token_prune_flat/runs  # tracked; bulky per-episode dirs are gitignored there
  jobtype: eval
  subset_label: ""
  episode_json: src/longnav/conf/episode_jsons/hm3d_v2_100.json  # the 100-episode HM3D-v2 split
  shard_size: 5
rollout:
  max_steps: 500
  deterministic: true  # argmax actions
  visualize_token_filtering: false
  visualize_attention: false
  visualize_attention_heads: false
  visualize_attention_3d: false
sim:
  fp_guard: false
  fn_guard: false
  ep_seed: 17
  add_top_down_map: false
  visualize_3d: false
  visualize_attn3d: false
vlm:
  use_sparse: true  # the model's native regime; stated so the saved config shows it
  sparse_threshold: 0.95
  context_frames: null  # full episode context: nothing is ever evicted by age
  context_cut: header  # inert without a window
  context_window_mode: prune
  kv_prune_importance: random  # overridden per arm
  kv_prune_candidate_scope: visual  # prefix and every text/action token are never candidates
  kv_prune_recent_turns: 0  # the just-decided turn's frame is history once its action is read
  kv_prune_ema_beta: 0.0  # rank by the current step's score only (no EMA)
  kv_prune_granularity: slot
  kv_prune_seed: 17
  kv_prune_seed_per_step: true  # random draws depend on (seed, episode label, step) only
  kv_prune_layer_start: 0  # every method deletes from every decoder layer
  kv_prune_log_masks: false  # without a window the log would re-pack every frame of the episode each step
