# @package _global_
# HAMLET (arXiv 2510.00695): moment tokens + memory module fused at the decision
# token. See longnav.utils.hamlet. Compose with `+hamlet=on`.
vlm:
  hamlet:
    enabled: true
    n_moment: 4
    d_mem: 512
    n_layers: 2
    n_heads: 8
    ffn_mult: 4
    memory_window: null   # whole episode
    max_blocks: 1024
    learning_rate: 1e-4
    moment_init_std: 0.02
